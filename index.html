<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Make your own Magic Wand!</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Mali:wght@400;600;700&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,600&display=swap');

        :root {
            --bg-cream: #fffdf5; --text-maroon: #5e1115; --gold: #d4af37; --pink-accent: #ff8ca3; --brown-accent: #8b5a2b;
        }

        body {
            font-family: 'Mali', cursive, sans-serif; background-color: var(--bg-cream); color: var(--text-maroon);
            margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh;
            background-image: radial-gradient(circle at top right, #e0f7fa 0%, transparent 20%), radial-gradient(circle at top left, #ffe4e1 0%, transparent 20%);
        }

        .app-container { width: 100%; max-width: 600px; padding: 20px; box-sizing: border-box; position: relative; overflow: hidden; }

        h1 {
            font-family: 'Playfair Display', serif; color: #fff; text-align: center; font-size: 28px; margin-bottom: 30px;
            text-shadow: 2px 2px 0 #ff6b81, -1px -1px 0 #ff6b81, 1px -1px 0 #ff6b81, -1px 1px 0 #ff6b81, 3px 3px 5px rgba(0,0,0,0.2);
        }

        #screen-builder { display: block; } #screen-result { display: none; position: relative; }
        .fade-out { animation: fadeOut 0.5s forwards; } .fade-in { animation: fadeIn 0.5s forwards; }
        @keyframes fadeOut { to { opacity: 0; visibility: hidden; } } @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* UI Controls Screen 1 */
        .controls-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .control-group h3 { font-size: 16px; margin: 0 0 10px 0; display: flex; align-items: center; gap: 5px; }
        .control-group h3::before { content: "✦"; color: var(--text-maroon); font-size: 18px; }

        .shape-selectors { display: flex; justify-content: center; gap: 15px; margin-bottom: 10px; }
        .shape-radio { display: none; }
        .shape-icon { font-size: 20px; cursor: pointer; transition: 0.2s; filter: grayscale(100%) opacity(0.5); }
        .shape-radio:checked + .shape-icon { filter: grayscale(0%) opacity(1); transform: scale(1.2); }

        select {
            width: 100%; padding: 8px 15px; border: 2px solid var(--gold); border-radius: 25px;
            background-color: #fff; color: var(--brown-accent); font-family: inherit; font-weight: bold;
            font-size: 14px; appearance: none; cursor: pointer; text-align: center;
        }
        .select-wrapper { position: relative; }
        .select-wrapper::after { content: "▼"; position: absolute; right: 15px; top: 10px; color: var(--gold); pointer-events: none; font-size: 12px; }

        /* Crystals Section */
        .crystal-section { grid-column: span 2; }
        .crystal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; align-items: start; justify-items: center; }
        .radio-circle { display: none; }
        .circle-label { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-weight: bold; font-size: 14px; }
        .circle-indicator { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--gold); background: #fff; display: inline-block; transition: 0.2s; position: relative; }
        .radio-circle:checked + .circle-indicator { background: var(--brown-accent); border-color: var(--brown-accent); }
        
        .crystal-dropdown-trigger .circle-indicator { border-radius: 50%; }
        .crystal-dropdown-trigger { border: 1px solid var(--gold); padding: 5px 15px; border-radius: 20px; background: #fff; }
        .sub-crystal-menu {
            display: none; flex-direction: column; gap: 5px; margin-top: 10px; padding: 10px;
            background: #fff9e6; border-radius: 10px; border: 1px dashed var(--gold); width: 100%;
        }

        .submit-section { text-align: center; margin: 20px 0; font-weight: bold; font-size: 18px; }
        .btn-yesss {
            padding: 8px 35px; font-size: 18px; font-weight: bold; font-family: inherit; color: var(--text-maroon); background: #fff; border: 2px solid var(--gold);
            border-radius: 30px; cursor: pointer; box-shadow: 0 4px 10px rgba(212, 175, 55, 0.3); margin-left: 15px; transition: transform 0.2s;
        }
        .btn-yesss:hover { transform: scale(1.05); background: #fff9e6; }

        /* Canvas Preview Area */
        .preview-box {
            width: 100%; height: 400px; background: url('assets/5.png') center/cover; background-color: #fcfcfc; border: 2px solid #ffccd5; border-radius: 15px;
            position: relative; overflow: hidden; display: flex; justify-content: center; align-items: center;
        }
        #screen-result .preview-box { height: 500px; border-color: #ffb6c1; border-width: 3px; border-radius: 20px; }

        .wand-scaler {
            width: 2048px; height: 2048px; position: absolute; transform: scale(0.18); transform-origin: center center;
            display: flex; justify-content: center; align-items: center; transition: background 0.3s;
        }

        .layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; pointer-events: none; display: none; }

        /* ปรับใบพัดให้สว่างขาวที่สุดด้วย Filter */
        #fan { z-index: 0; display: block; transition: transform 0.6s ease-in-out, opacity 0.3s; filter: brightness(120%) grayscale(100%) contrast(120%); }
        #hand { z-index: 1; display: block; }
        #base { z-index: 2; display: block; }
        #wings { z-index: 3; display: block; }
        #main-head { z-index: 4; display: block; }
        #sub-head { z-index: 5; }
        .crystal-layer { z-index: 6; }

        .part-head { transition: transform 0.6s ease-in-out; }
        .part-head.move-down { transform: translateY(500px); }
        #fan.hidden-down { transform: translateY(1000px); opacity: 0; }
        #fan.show-up { transform: translateY(0); opacity: 1; }

        /* Screen 2 Result Controls */
        .action-bar { display: flex; flex-direction: column; gap: 15px; margin-top: 20px; align-items: center; }
        .bg-controls { display: flex; gap: 10px; align-items: center; background: #fff; padding: 15px; border-radius: 20px; border: 2px dashed #ffccd5; width: 95%; justify-content: center; flex-wrap: wrap; box-sizing: border-box; }
        .bg-picker { width: 35px; height: 35px; border-radius: 50%; border: 2px solid var(--text-maroon); cursor: pointer; padding: 0; flex-shrink: 0; }
        .bg-picker::-webkit-color-swatch-wrapper { padding: 0; } .bg-picker::-webkit-color-swatch { border: none; }
        .btn-small { background: #fff0f5; border: 1px solid #ffb6c1; padding: 8px 12px; border-radius: 12px; cursor: pointer; font-family: inherit; font-weight: bold; color: var(--text-maroon); transition: 0.2s; font-size: 13px; }
        .btn-small:hover { background: #ffe4e1; }
        .transparent-label { font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 5px; font-weight: bold; }
        .action-buttons { display: flex; gap: 30px; align-items: center; }
        .push-btn { width: 70px; height: 70px; border-radius: 50%; background: linear-gradient(145deg, #ffffff, #e6e6e6); border: none; box-shadow: 5px 5px 10px #d9d9d9, -5px -5px 10px #ffffff; font-family: inherit; font-weight: 900; font-size: 20px; color: var(--text-maroon); cursor: pointer; transition: all 0.2s; }
        .push-btn.active { background: #ffffff; box-shadow: inset 5px 5px 10px #d9d9d9, inset -5px -5px 10px #ffffff; color: var(--pink-accent); }
        .btn-save { padding: 10px 30px; font-size: 20px; font-weight: 900; color: var(--text-maroon); background: #fff; border: 2px solid var(--text-maroon); border-radius: 30px; cursor: pointer; font-family: inherit; transition: 0.2s; }
        .btn-save:hover { background: var(--text-maroon); color: #fff; }
        .btn-back { position: absolute; top: -15px; left: 0; background: none; border: none; color: var(--text-maroon); font-family: inherit; font-weight: bold; font-size: 14px; cursor: pointer; display: flex; align-items: center; gap: 5px; opacity: 0.7; transition: 0.2s; }
        .btn-back:hover { opacity: 1; text-decoration: underline; }
        #sparkle-container { position: fixed; top:0; left:0; width: 100%; height: 100%; pointer-events: none; z-index: 9999; }
        .sparkle { position: absolute; background: white; border-radius: 50%; box-shadow: 0 0 10px 2px #fff, 0 0 20px 5px #ffb6c1; animation: pop 1s ease-out forwards; }
        @keyframes pop { 0% { transform: scale(0); opacity: 1; } 100% { transform: scale(1.5) translateY(-50px); opacity: 0; } }
        .checkerboard { background-color: transparent !important; background-image: repeating-linear-gradient(45deg, #f0f0f0 25%, transparent 25%, transparent 75%, #f0f0f0 75%, #f0f0f0), repeating-linear-gradient(45deg, #f0f0f0 25%, #ffffff 25%, #ffffff 75%, #f0f0f0 75%, #f0f0f0) !important; background-position: 0 0, 20px 20px !important; background-size: 40px 40px !important; }
    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- SCREEN 1: BUILDER -->
        <div id="screen-builder">
            <h1>Make your own Magic Wand!</h1>

            <div class="controls-grid">
                <div class="control-group"><h3>Handle ด้าม</h3><div class="select-wrapper"><select id="sel-handle" onchange="updateWand()"><option value="W1">colour (White)</option><option value="B1">colour (Blue)</option><option value="P1">colour (Pink)</option></select></div></div>
                <div class="control-group"><h3>Base ฐานรองหัว</h3><div class="select-wrapper"><select id="sel-base" onchange="updateWand()"><option value="W2">colour (White)</option><option value="B2">colour (Blue)</option><option value="P2">colour (Pink)</option></select></div></div>

                <div class="control-group">
                    <h3>Main head หัวคฑาหลัก</h3>
                    <div class="shape-selectors">
                        <label><input type="radio" name="m-shape" value="3" class="shape-radio" checked onchange="updateUI()"> <span class="shape-icon">🤎</span></label>
                        <label><input type="radio" name="m-shape" value="4" class="shape-radio" onchange="updateUI()"> <span class="shape-icon">⭐</span></label>
                        <label><input type="radio" name="m-shape" value="5" class="shape-radio" onchange="updateUI()"> <span class="shape-icon">❄️</span></label>
                    </div>
                    <div class="select-wrapper"><select id="sel-main-color" onchange="updateWand()"><option value="W">colour (White)</option><option value="B">colour (Blue)</option><option value="P">colour (Pink)</option></select></div>
                </div>
                <div class="control-group">
                    <h3>Sub-head หัวคฑาเสริม</h3>
                    <div class="shape-selectors">
                        <label><input type="radio" name="s-shape" value="none" class="shape-radio" checked onchange="updateUI()"> <span class="shape-icon">❌</span></label>
                        <label><input type="radio" name="s-shape" value="6" class="shape-radio" onchange="updateUI()"> <span class="shape-icon">🤎</span></label>
                        <label><input type="radio" name="s-shape" value="7" class="shape-radio" onchange="updateUI()"> <span class="shape-icon">⭐</span></label>
                        <label><input type="radio" name="s-shape" value="8" class="shape-radio" onchange="updateUI()"> <span class="shape-icon">❄️</span></label>
                    </div>
                    <div class="select-wrapper"><select id="sel-sub-color" onchange="updateWand()"><option value="W">colour (White)</option><option value="B">colour (Blue)</option><option value="P">colour (Pink)</option></select></div>
                </div>

                <div class="control-group"><h3>Wings ปีก</h3><div class="select-wrapper"><select id="sel-wings" onchange="updateWand()"><option value="W9">choose (White Wings)</option><option value="B9">choose (Blue Wings)</option><option value="none">choose (None)</option></select></div></div>

                <div class="control-group crystal-section">
                    <h3>Crystals คริสตัล</h3>
                    <div class="crystal-grid">
                        <label class="circle-label"><input type="checkbox" id="chk-c1" class="radio-circle" onchange="updateWand()"><span class="circle-indicator"></span> Handle</label>
                        <label class="circle-label"><input type="checkbox" id="chk-c2" class="radio-circle" onchange="updateWand()"><span class="circle-indicator"></span> Base</label>
                        
                        <div style="width: 100%;">
                            <label class="circle-label crystal-dropdown-trigger"><input type="checkbox" id="chk-main-crystal" class="radio-circle" onchange="toggleCrystalMenu('main')"><span class="circle-indicator"></span> Main head ▼</label>
                            <div id="main-crystal-menu" class="sub-crystal-menu"></div>
                        </div>
                        <div style="width: 100%;">
                            <label class="circle-label crystal-dropdown-trigger"><input type="checkbox" id="chk-sub-crystal" class="radio-circle" onchange="toggleCrystalMenu('sub')"><span class="circle-indicator"></span> Sub-head ▼</label>
                            <div id="sub-crystal-menu" class="sub-crystal-menu"></div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="submit-section">Satisfy? <button class="btn-yesss" onclick="triggerMagicEffect()">YESSS</button></div>

            <div class="preview-box">
                <div style="position: absolute; top: 10px; left: 15px; font-size: 14px; font-style: italic; color: #ffb6c1; z-index: 10;">Here's your wand!</div>
                <div class="wand-scaler" id="wand-dom">
                    <img id="fan" src="assets/F0.png" class="layer hidden-down">
                    <img id="hand" src="assets/W1.png" class="layer">
                    <img id="c1-crystal" src="assets/C1.png" class="layer crystal-layer">
                    
                    <img id="base" src="assets/W2.png" class="layer part-head">
                    <img id="wings" src="assets/W9.png" class="layer part-head">
                    <img id="main-head" src="assets/W3.png" class="layer part-head">
                    <img id="sub-head" src="" class="layer part-head">
                    <img id="c2-crystal" src="assets/C2.png" class="layer crystal-layer part-head">
                    
                    <img id="c-main-1" src="" class="layer crystal-layer part-head">
                    <img id="c-main-3" src="" class="layer crystal-layer part-head">
                    <img id="c-sub-2" src="" class="layer crystal-layer part-head">
                    <img id="c-sub-4" src="" class="layer crystal-layer part-head">
                </div>
            </div>
        </div>

        <!-- SCREEN 2: RESULT -->
        <div id="screen-result">
            <button class="btn-back" onclick="backToDesign()">↺ Back to Edit</button>
            <h1 style="color: var(--text-maroon); text-shadow: 2px 2px 0 #fff; margin-top: 30px;">Wow incredible Magic Wand!</h1>
            
            <div class="preview-box" id="result-preview-box"></div>

            <div class="action-bar">
                <div class="bg-controls">
                    <div style="font-size: 14px; font-style: italic; width: 100%; text-align: center; color: var(--pink-accent); margin-bottom: 5px;">Background Settings</div>
                    <input type="color" id="bg-color" class="bg-picker" value="#ffffff" onchange="setBgMode('color')" title="เลือกสีพื้นหลัง">
                    <select id="sel-preset-bg" class="btn-small" style="appearance: auto;" onchange="setBgMode('preset')">
                        <option value="">✨ ซีนสำเร็จรูป...</option>
                        <option value="background/bg1.jpg">ฉากที่ 1 (ตัวอย่าง)</option>
                        <option value="background/bg2.jpg">ฉากที่ 2 (ตัวอย่าง)</option>
                    </select>
                    <button class="btn-small" onclick="document.getElementById('bg-upload').click()">🖼️ อัปโหลด</button>
                    <input type="file" id="bg-upload" accept="image/*" style="display:none" onchange="handleBgUpload(event)">
                    <label class="transparent-label"><input type="checkbox" id="chk-transparent" onchange="setBgMode('transparent')"> โปร่งใส</label>
                    <img id="uploaded-bg-img" style="display:none;">
                    <img id="preset-bg-img" style="display:none;">
                </div>

                <div class="action-buttons">
                    <button class="push-btn" id="btn-fan-toggle" onclick="toggleFan()">OFF</button>
                    <button class="btn-save" onclick="exportToImage()">SAVE</button>
                </div>
            </div>
            
            <div style="text-align: right; margin-top: 10px; font-size: 12px; font-style: italic; color: #ff8ca3;">Design by you! &nbsp;&nbsp;&nbsp; By : EmanonMUI</div>
        </div>

        <div id="sparkle-container"></div>
    </div>

    <script>
        const PATH = 'assets/';
        const getRadio = (name) => document.querySelector(`input[name="${name}"]:checked`).value;

        function updateUI() {
            const mShape = getRadio('m-shape');
            const sShape = getRadio('s-shape');

            const mainMenu = document.getElementById('main-crystal-menu');
            let mHtml = '';
            if (mShape === '3') {
                mHtml = `<label><input type="checkbox" id="cm_1" onchange="updateWand()"> C3_1 (Heart Main)</label>`;
            } else if (mShape === '4') {
                mHtml = `<label><input type="checkbox" id="cm_1" onchange="handleStarCrystals('cm_1')"> C4_1 (Star Main)</label>
                         <label><input type="checkbox" id="cm_3" onchange="handleStarCrystals('cm_3')"> C4_3 (Star Main)</label>`;
            } else if (mShape === '5') {
                mHtml = `<label><input type="checkbox" id="cm_1" onchange="updateWand()"> C5_1 (Snow Main)</label>`;
            }
            mainMenu.innerHTML = mHtml;

            const subMenu = document.getElementById('sub-crystal-menu');
            let sHtml = '';
            if (sShape === 'none') {
                sHtml = '<small style="color:#999;">No sub-head selected</small>';
                document.getElementById('chk-sub-crystal').checked = false;
            } else if (sShape === '6') { 
                sHtml = `<label><input type="checkbox" id="cs_2" onchange="updateWand()"> C3_2 (Heart Sub)</label>`;
            } else if (sShape === '7') {
                sHtml = `<label><input type="checkbox" id="cs_2" onchange="handleStarCrystals('cs_2')"> C4_2 (Star Sub)</label>
                         <label><input type="checkbox" id="cs_4" onchange="handleStarCrystals('cs_4')"> C4_4 (Star Sub)</label>`;
            } else if (sShape === '8') {
                sHtml = `<label><input type="checkbox" id="cs_2" onchange="updateWand()"> C5_2 (Snow Sub)</label>`;
            }
            subMenu.innerHTML = sHtml;

            document.getElementById('chk-main-crystal').checked = false; 
            document.getElementById('chk-sub-crystal').checked = false;
            mainMenu.style.display = 'none'; 
            subMenu.style.display = 'none';
            updateWand();
        }

        function handleStarCrystals(id) {
            if (id === 'cm_1' && document.getElementById('cm_1').checked) { if(document.getElementById('cm_3')) document.getElementById('cm_3').checked = false; }
            if (id === 'cm_3' && document.getElementById('cm_3').checked) { if(document.getElementById('cm_1')) document.getElementById('cm_1').checked = false; }
            if (id === 'cs_2' && document.getElementById('cs_2').checked) { if(document.getElementById('cs_4')) document.getElementById('cs_4').checked = false; }
            if (id === 'cs_4' && document.getElementById('cs_4').checked) { if(document.getElementById('cs_2')) document.getElementById('cs_2').checked = false; }
            updateWand();
        }

        function toggleCrystalMenu(type) {
            const isChecked = document.getElementById(`chk-${type}-crystal`).checked;
            document.getElementById(`${type}-crystal-menu`).style.display = isChecked ? 'flex' : 'none'; updateWand();
        }

        function updateWand() {
            document.getElementById('hand').src = PATH + document.getElementById('sel-handle').value + '.png';
            document.getElementById('base').src = PATH + document.getElementById('sel-base').value + '.png';
            
            const mShape = getRadio('m-shape'); 
            const mColor = document.getElementById('sel-main-color').value;
            document.getElementById('main-head').src = PATH + mColor + mShape + '.png';

            const sShape = getRadio('s-shape'); 
            const subHead = document.getElementById('sub-head');
            if (sShape === 'none') { 
                subHead.style.display = 'none'; 
            } else { 
                subHead.src = PATH + document.getElementById('sel-sub-color').value + sShape + '.png'; 
                subHead.style.display = 'block'; 
            }

            const wing = document.getElementById('sel-wings').value; 
            const wingsImg = document.getElementById('wings');
            if (wing === 'none') { wingsImg.style.display = 'none'; } else { wingsImg.src = PATH + wing + '.png'; wingsImg.style.display = 'block'; }

            document.getElementById('c1-crystal').style.display = document.getElementById('chk-c1').checked ? 'block' : 'none';
            document.getElementById('c2-crystal').style.display = document.getElementById('chk-c2').checked ? 'block' : 'none';

            document.getElementById('c-main-1').style.display = 'none';
            document.getElementById('c-main-3').style.display = 'none';
            document.getElementById('c-sub-2').style.display = 'none';
            document.getElementById('c-sub-4').style.display = 'none';

            if (document.getElementById('chk-main-crystal').checked) {
                const mPrefix = mShape === '3' ? 'C3' : (mShape === '4' ? 'C4' : 'C5');
                if (document.getElementById('cm_1') && document.getElementById('cm_1').checked) { 
                    document.getElementById('c-main-1').src = PATH + mPrefix + '_1.png'; 
                    document.getElementById('c-main-1').style.display = 'block'; 
                }
                if (document.getElementById('cm_3') && document.getElementById('cm_3').checked) { 
                    document.getElementById('c-main-3').src = PATH + mPrefix + '_3.png'; 
                    document.getElementById('c-main-3').style.display = 'block'; 
                }
            }

            if (document.getElementById('chk-sub-crystal').checked && sShape !== 'none') {
                const sPrefix = sShape === '6' ? 'C3' : (sShape === '7' ? 'C4' : 'C5');
                if (document.getElementById('cs_2') && document.getElementById('cs_2').checked) { 
                    document.getElementById('c-sub-2').src = PATH + sPrefix + '_2.png'; 
                    document.getElementById('c-sub-2').style.display = 'block'; 
                }
                if (document.getElementById('cs_4') && document.getElementById('cs_4').checked) { 
                    document.getElementById('c-sub-4').src = PATH + sPrefix + '_4.png'; 
                    document.getElementById('c-sub-4').style.display = 'block'; 
                }
            }
        }

        function triggerMagicEffect() {
            const container = document.getElementById('sparkle-container');
            for(let i=0; i<30; i++) {
                setTimeout(() => {
                    const spark = document.createElement('div'); spark.className = 'sparkle';
                    spark.style.left = Math.random() * 100 + 'vw'; spark.style.top = Math.random() * 100 + 'vh';
                    const size = Math.random() * 15 + 5; spark.style.width = size + 'px'; spark.style.height = size + 'px';
                    container.appendChild(spark); setTimeout(() => spark.remove(), 1000);
                }, i * 30);
            }

            setTimeout(() => {
                document.getElementById('screen-builder').classList.add('fade-out');
                setTimeout(() => {
                    document.getElementById('screen-builder').style.display = 'none'; document.getElementById('screen-builder').classList.remove('fade-out');
                    document.getElementById('screen-result').style.display = 'block'; document.getElementById('screen-result').classList.add('fade-in');
                    document.getElementById('result-preview-box').appendChild(document.getElementById('wand-dom'));
                    setBgMode(currentBgMode); 
                }, 500);
            }, 800);
        }

        function backToDesign() {
            document.getElementById('screen-result').classList.add('fade-out');
            setTimeout(() => {
                document.getElementById('screen-result').style.display = 'none'; document.getElementById('screen-result').classList.remove('fade-out');
                document.getElementById('screen-builder').style.display = 'block'; document.getElementById('screen-builder').classList.add('fade-in');
                document.querySelector('#screen-builder .preview-box').appendChild(document.getElementById('wand-dom'));
                document.getElementById('wand-dom').className = 'wand-scaler'; document.getElementById('wand-dom').style = '';
                if(isFanOpen) toggleFan(); 
            }, 500);
        }

        let currentBgMode = 'color'; 
        function handleBgUpload(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('uploaded-bg-img').src = e.target.result;
                    document.getElementById('sel-preset-bg').value = ""; 
                    setBgMode('upload');
                };
                reader.readAsDataURL(file);
            }
        }

        function setBgMode(mode) {
            currentBgMode = mode;
            const wandDom = document.getElementById('wand-dom');
            wandDom.className = 'wand-scaler'; 

            if (mode === 'transparent') {
                document.getElementById('chk-transparent').checked = true;
                document.getElementById('sel-preset-bg').value = "";
                wandDom.style.background = 'none';
                wandDom.classList.add('checkerboard');
            } else {
                document.getElementById('chk-transparent').checked = false;
                if (mode === 'color') {
                    document.getElementById('sel-preset-bg').value = "";
                    wandDom.style.background = 'none';
                    wandDom.style.backgroundColor = document.getElementById('bg-color').value;
                } else if (mode === 'preset') {
                    const presetPath = document.getElementById('sel-preset-bg').value;
                    if (presetPath) {
                        document.getElementById('preset-bg-img').src = presetPath; 
                        wandDom.style.background = `url(${presetPath}) center/cover no-repeat`;
                    } else {
                        setBgMode('color'); 
                    }
                } else if (mode === 'upload') {
                    const uploadedSrc = document.getElementById('uploaded-bg-img').src;
                    wandDom.style.background = `url(${uploadedSrc}) center/cover no-repeat`;
                }
            }
        }

        let isFanOpen = false; let isAnimating = false; const gifDuration = 1200;
        function toggleFan() {
            if (isAnimating) return; isAnimating = true;
            const btn = document.getElementById('btn-fan-toggle'); const fan = document.getElementById('fan'); const headParts = document.querySelectorAll('.part-head'); 
            if (!isFanOpen) {
                btn.innerHTML = "ON"; btn.classList.add('active'); fan.src = PATH + 'F0.png';
                headParts.forEach(el => el.classList.add('move-down')); fan.classList.remove('hidden-down'); fan.classList.add('show-up');
                setTimeout(() => { fan.src = PATH + 'F_animate.gif?' + Date.now(); setTimeout(() => { fan.src = PATH + 'F1.png'; isFanOpen = true; isAnimating = false; }, gifDuration); }, 600);
            } else {
                btn.innerHTML = "OFF"; btn.classList.remove('active'); fan.src = PATH + 'F_animate_in.gif?' + Date.now();
                setTimeout(() => { fan.src = PATH + 'F0.png'; headParts.forEach(el => el.classList.remove('move-down')); fan.classList.remove('show-up'); fan.classList.add('hidden-down'); setTimeout(() => { isFanOpen = false; isAnimating = false; }, 600); }, gifDuration);
            }
        }

        async function exportToImage() {
            const btn = document.querySelector('.btn-save'); btn.innerHTML = "Saving...";
            
            const canvas = document.createElement('canvas'); canvas.width = 2048; canvas.height = 2048;
            const ctx = canvas.getContext('2d');

            if (currentBgMode !== 'transparent') {
                if (currentBgMode === 'color') {
                    ctx.fillStyle = document.getElementById('bg-color').value; ctx.fillRect(0, 0, 2048, 2048);
                } else if (currentBgMode === 'preset') {
                    const presetImg = document.getElementById('preset-bg-img');
                    if (presetImg.src && presetImg.src !== window.location.href) { ctx.drawImage(presetImg, 0, 0, 2048, 2048); }
                } else if (currentBgMode === 'upload') {
                    const uploadedImg = document.getElementById('uploaded-bg-img');
                    if (uploadedImg.src && uploadedImg.src !== window.location.href) { ctx.drawImage(uploadedImg, 0, 0, 2048, 2048); }
                }
            }

            const drawImg = (id) => {
                return new Promise((resolve) => {
                    const imgEl = document.getElementById(id);
                    if (!imgEl || imgEl.style.display === 'none' || !imgEl.src || imgEl.src.endsWith('none.png') || imgEl.classList.contains('hidden-down')) { resolve(); return; }
                    const img = new Image(); img.crossOrigin = "anonymous";
                    img.onload = () => { 
                        const offsetY = imgEl.classList.contains('move-down') ? 500 : 0; 
                        
                        // ฟิลเตอร์ฟอกขาวสำหรับพัดตอนเซฟรูป
                        if (id === 'fan') {
                            ctx.filter = 'brightness(250%) grayscale(100%) contrast(120%)';
                        } else {
                            ctx.filter = 'none';
                        }
                        
                        ctx.drawImage(img, 0, offsetY, 2048, 2048); 
                        ctx.filter = 'none'; // คืนค่าเป็น none หลังวาดเสร็จ
                        resolve(); 
                    };
                    img.onerror = resolve; img.src = imgEl.src;
                });
            };

            await drawImg('fan'); await drawImg('hand'); await drawImg('base');
            await drawImg('wings'); await drawImg('main-head'); await drawImg('sub-head');
            await drawImg('c1-crystal'); await drawImg('c2-crystal');
            
            await drawImg('c-main-1'); await drawImg('c-main-3');
            await drawImg('c-sub-2'); await drawImg('c-sub-4');

            ctx.font = "bold 90px 'Playfair Display', serif"; ctx.textAlign = "center"; ctx.lineJoin = "round";
            ctx.lineWidth = 15; ctx.strokeStyle = "rgba(255, 255, 255, 0.8)";
            ctx.strokeText("May your life be magical!", 1024, 180);
            ctx.fillStyle = "#ff6b81"; ctx.fillText("May your life be magical!", 1024, 180);

            ctx.font = "italic 36px 'Mali', sans-serif"; ctx.fillStyle = "#5e1115"; ctx.textAlign = "right";
            ctx.lineWidth = 5; ctx.strokeStyle = "rgba(255, 255, 255, 0.5)";
            ctx.strokeText("webdesign by emanonmui IG:ium_kamonwan", 2000, 2000);
            ctx.fillText("webdesign by emanonmui IG:ium_kamonwan", 2000, 2000);

            const link = document.createElement('a'); link.download = 'MyMagicWand.png'; link.href = canvas.toDataURL('image/png'); link.click();
            btn.innerHTML = "SAVE";
        }

        updateUI();
    </script>
</body>
</html>
