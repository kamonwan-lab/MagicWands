<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Make your own Magic Wand!</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Mali:wght@400;600;700&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,600&display=swap');

        :root {
            --bg-cream: #fffdf5;
            --text-maroon: #5e1115;
            --gold: #d4af37;
            --pink-accent: #ff8ca3;
        }

        body {
            font-family: 'Mali', cursive, sans-serif;
            background-color: var(--bg-cream);
            color: var(--text-maroon);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-image: radial-gradient(circle at top right, #e0f7fa 0%, transparent 20%),
                              radial-gradient(circle at top left, #ffe4e1 0%, transparent 20%);
        }

        .app-container {
            width: 100%;
            max-width: 600px;
            padding: 20px;
            box-sizing: border-box;
            position: relative;
            overflow: hidden;
        }

        /* --- Typography --- */
        h1 {
            font-family: 'Playfair Display', serif;
            color: #fff;
            text-shadow: 2px 2px 0 #ff6b81, -1px -1px 0 #ff6b81, 1px -1px 0 #ff6b81, -1px 1px 0 #ff6b81, 3px 3px 5px rgba(0,0,0,0.2);
            text-align: center;
            font-size: 28px;
            margin-bottom: 30px;
        }

        /* --- Screen Switching --- */
        #screen-builder { display: block; }
        #screen-result { display: none; }
        .fade-out { animation: fadeOut 0.5s forwards; }
        .fade-in { animation: fadeIn 0.5s forwards; }

        @keyframes fadeOut { to { opacity: 0; visibility: hidden; } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* --- UI Controls (Screen 1) --- */
        .controls-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .control-group h3 {
            font-size: 16px;
            margin: 0 0 10px 0;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .control-group h3::before {
            content: "✦"; color: var(--text-maroon); font-size: 18px;
        }

        /* Dropdown Styling */
        select {
            width: 100%;
            padding: 10px 15px;
            border: 2px solid var(--gold);
            border-radius: 25px;
            background-color: #fff;
            color: var(--text-maroon);
            font-family: inherit;
            font-weight: bold;
            font-size: 16px;
            appearance: none;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            text-align: center;
        }
        .select-wrapper { position: relative; }
        .select-wrapper::after {
            content: "▼"; position: absolute; right: 15px; top: 12px;
            color: var(--gold); pointer-events: none; font-size: 12px;
        }

        /* Crystal Radios/Checkboxes */
        .crystal-section { grid-column: span 2; display: flex; flex-wrap: wrap; gap: 15px; align-items: center; justify-content: center;}
        .radio-circle { display: none; }
        .circle-label {
            display: inline-flex; align-items: center; gap: 8px;
            cursor: pointer; font-weight: bold; font-size: 14px;
        }
        .circle-indicator {
            width: 20px; height: 20px; border-radius: 50%;
            border: 2px solid var(--gold); background: #fff;
            display: inline-block; transition: 0.2s;
        }
        .radio-circle:checked + .circle-indicator { background: #b58b4c; border-color: #b58b4c; }
        .crystal-options { width: 100%; display: flex; justify-content: center; gap: 10px; margin-top: 5px; }

        /* YESSS Button */
        .submit-section { text-align: center; margin: 30px 0; font-weight: bold; font-size: 18px;}
        .btn-yesss {
            padding: 10px 40px; font-size: 20px; font-weight: bold; font-family: inherit;
            color: var(--text-maroon); background: #fff;
            border: 2px solid var(--gold); border-radius: 30px;
            cursor: pointer; box-shadow: 0 4px 10px rgba(212, 175, 55, 0.3);
            margin-left: 15px; transition: transform 0.2s;
        }
        .btn-yesss:hover { transform: scale(1.05); background: #fff9e6; }

        /* --- Canvas Preview Area --- */
        .preview-box {
            width: 100%; height: 400px;
            background: url('assets/5.png') center/cover; /* ใช้ภาพพื้นหลังกระดาษที่คุณแนบมา */
            background-color: #fcfcfc;
            border: 2px solid #ffccd5;
            border-radius: 15px;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.03);
            display: flex; justify-content: center; align-items: center;
        }

        /* ขนาดจริงคือ 2048 แต่อยู่ในกล่องเล็ก เลยต้องย่อ Scale */
        .wand-scaler {
            width: 2048px; height: 2048px;
            position: absolute;
            transform: scale(0.18); /* ปรับสเกลให้พอดีกับกล่อง preview */
            transform-origin: center center;
            display: flex; justify-content: center; align-items: center;
            transition: background-color 0.3s;
        }

        .layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            object-fit: contain; pointer-events: none; display: none;
        }

        /* Z-Index แกน Z */
        #fan { z-index: 0; transition: transform 0.6s ease-in-out; display: block;}
        #hand { z-index: 1; display: block; }
        #base { z-index: 2; display: block; }
        #wings { z-index: 3; display: block; }
        #main-head { z-index: 4; display: block; }
        #sub-head { z-index: 5; }
        .crystal-layer { z-index: 6; }

        /* Animation States สำหรับพัด */
        .head-group { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transition: transform 0.6s ease-in-out; }
        .head-group.move-down { transform: translateY(300px); /* ขยับลงในสเกล 2048px */ }
        #fan.hidden-down { transform: translateY(600px); opacity: 0; }
        #fan.show-up { transform: translateY(0); opacity: 1; }

        /* --- Screen 2 (Result/Export) --- */
        #screen-result .preview-box { height: 500px; border-color: #ffb6c1; border-width: 3px; border-radius: 20px; }
        
        .action-bar {
            display: flex; justify-content: space-around; align-items: center;
            margin-top: 30px; padding: 0 20px;
        }

        /* Color Picker */
        .bg-picker-wrapper { text-align: center; font-size: 14px; font-style: italic; }
        .bg-picker {
            width: 40px; height: 40px; border-radius: 50%;
            border: 2px solid var(--text-maroon); overflow: hidden;
            cursor: pointer; padding: 0; margin-top: 5px;
        }
        .bg-picker::-webkit-color-swatch-wrapper { padding: 0; }
        .bg-picker::-webkit-color-swatch { border: none; }

        /* Push Button (ON/OFF) */
        .push-btn {
            width: 80px; height: 80px; border-radius: 50%;
            background: linear-gradient(145deg, #ffffff, #e6e6e6);
            border: none;
            box-shadow:  5px 5px 10px #d9d9d9, -5px -5px 10px #ffffff;
            font-family: inherit; font-weight: 900; font-size: 22px;
            color: var(--text-maroon); cursor: pointer;
            transition: all 0.2s; display: flex; justify-content: center; align-items: center;
        }
        .push-btn.active {
            background: #ffffff;
            box-shadow: inset 5px 5px 10px #d9d9d9, inset -5px -5px 10px #ffffff;
            color: var(--pink-accent);
        }

        /* Save Button */
        .btn-save {
            padding: 10px 30px; font-size: 20px; font-weight: 900;
            color: var(--text-maroon); background: #fff;
            border: 2px solid var(--text-maroon); border-radius: 30px;
            cursor: pointer; font-family: inherit; transition: 0.2s;
        }
        .btn-save:hover { background: var(--text-maroon); color: #fff; }

        /* Sparkle Effect Container */
        #sparkle-container { position: fixed; top:0; left:0; width: 100%; height: 100%; pointer-events: none; z-index: 9999; }
        .sparkle { position: absolute; background: white; border-radius: 50%; box-shadow: 0 0 10px 2px #fff, 0 0 20px 5px #ffb6c1; animation: pop 1s ease-out forwards; }
        @keyframes pop { 0% { transform: scale(0); opacity: 1; } 100% { transform: scale(1.5) translateY(-50px); opacity: 0; } }
    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- ================= SCREEN 1: BUILDER ================= -->
        <div id="screen-builder">
            <h1>Make your own Magic Wand!</h1>

            <div class="controls-grid">
                <div class="control-group">
                    <h3>Handle ด้าม</h3>
                    <div class="select-wrapper">
                        <select id="sel-handle" onchange="updateWand()">
                            <option value="W1">choose (White)</option>
                            <option value="B1">choose (Blue)</option>
                            <option value="P1">choose (Pink)</option>
                        </select>
                    </div>
                </div>

                <div class="control-group">
                    <h3>Base ฐานรองหัว</h3>
                    <div class="select-wrapper">
                        <select id="sel-base" onchange="updateWand()">
                            <option value="W2">choose (White)</option>
                            <option value="B2">choose (Blue)</option>
                            <option value="P2">choose (Pink)</option>
                        </select>
                    </div>
                </div>

                <div class="control-group">
                    <h3>Main head หัวคฑาหลัก</h3>
                    <div class="select-wrapper">
                        <select id="sel-main" onchange="updateWand()">
                            <option value="W3">choose (Heart White)</option>
                            <option value="B4">choose (Star Blue)</option>
                            <option value="P5">choose (Snow Pink)</option>
                        </select>
                    </div>
                </div>

                <div class="control-group">
                    <h3>Sub-head หัวคฑาเสริม</h3>
                    <div class="select-wrapper">
                        <select id="sel-sub" onchange="updateWand()">
                            <option value="none">choose (None)</option>
                            <option value="W6">choose (Mini Heart W)</option>
                            <option value="B7">choose (Mini Star B)</option>
                            <option value="P8">choose (Mini Snow P)</option>
                        </select>
                    </div>
                </div>

                <div class="control-group">
                    <h3>Wings ปีก</h3>
                    <div class="select-wrapper">
                        <select id="sel-wings" onchange="updateWand()">
                            <option value="W9">choose (White Wings)</option>
                            <option value="B9">choose (Blue Wings)</option>
                            <option value="none">choose (None)</option>
                        </select>
                    </div>
                </div>

                <div class="control-group crystal-section">
                    <h3>Crystals คริสตัล</h3>
                    <div style="display: flex; gap: 15px; flex-wrap: wrap; justify-content: center; width: 100%;">
                        <label class="circle-label">
                            <input type="checkbox" id="chk-c1" class="radio-circle" onchange="updateWand()">
                            <span class="circle-indicator"></span> Handle
                        </label>
                        <label class="circle-label">
                            <input type="checkbox" id="chk-c2" class="radio-circle" onchange="updateWand()">
                            <span class="circle-indicator"></span> Base
                        </label>
                        <div class="crystal-options" id="c-head-options">
                            <!-- จะถูก JS อัปเดตตาม Main Head -->
                            <label class="circle-label"><input type="checkbox" id="chk-c3_1" class="radio-circle" onchange="updateWand()"><span class="circle-indicator"></span> Main 1</label>
                            <label class="circle-label"><input type="checkbox" id="chk-c3_2" class="radio-circle" onchange="updateWand()"><span class="circle-indicator"></span> Main 2</label>
                        </div>
                    </div>
                </div>
            </div>

            <div class="submit-section">
                Satisfy? <button class="btn-yesss" onclick="triggerMagicEffect()">YESSS</button>
            </div>

            <div class="preview-box">
                <div style="position: absolute; top: 10px; left: 15px; font-size: 14px; font-style: italic; color: #ffb6c1;">Here's your wand!</div>
                <!-- Wand DOM -->
                <div class="wand-scaler" id="wand-dom">
                    <!-- Layer Z:0 Fan -->
                    <img id="fan" src="assets/F0.png" class="layer hidden-down">
                    <!-- Layer Z:1 Hand -->
                    <img id="hand" src="assets/W1.png" class="layer">
                    <!-- Layer Z:6 Crystal C1 -->
                    <img id="c1-crystal" src="assets/C1.png" class="layer crystal-layer">

                    <!-- Head Group -->
                    <div id="head-group" class="head-group">
                        <img id="base" src="assets/W2.png" class="layer">
                        <img id="wings" src="assets/W9.png" class="layer">
                        <img id="main-head" src="assets/W3.png" class="layer">
                        <img id="sub-head" src="" class="layer">
                        
                        <img id="c2-crystal" src="assets/C2.png" class="layer crystal-layer">
                        <img id="c-head-1" src="" class="layer crystal-layer">
                        <img id="c-head-2" src="" class="layer crystal-layer">
                        <img id="c-head-3" src="" class="layer crystal-layer">
                        <img id="c-head-4" src="" class="layer crystal-layer">
                    </div>
                </div>
            </div>
        </div>

        <!-- ================= SCREEN 2: RESULT ================= -->
        <div id="screen-result">
            <h1 style="color: var(--text-maroon); text-shadow: 2px 2px 0 #fff;">Wow incredible Magic Wand!</h1>
            
            <div class="preview-box" id="result-preview-box">
                <!-- Wand will be moved here by JS -->
            </div>

            <div class="action-bar">
                <div class="bg-picker-wrapper">
                    Background<br>
                    <input type="color" id="bg-color" class="bg-picker" value="#ffffff" onchange="changeBgColor()">
                </div>
                
                <!-- Push Button -->
                <button class="push-btn" id="btn-fan-toggle" onclick="toggleFan()">OFF</button>

                <button class="btn-save" onclick="exportToImage()">SAVE</button>
            </div>
            
            <div style="text-align: right; margin-top: 15px; font-size: 12px; font-style: italic; color: #ff8ca3;">
                Design by you! &nbsp;&nbsp;&nbsp; By : EmanonMUI
            </div>
        </div>

        <div id="sparkle-container"></div>
    </div>

    <script>
        const PATH = 'assets/';

        // --- 1. อัปเดตชิ้นส่วนคฑา (เหมือนเวอร์ชันก่อนหน้า) ---
        function updateWand() {
            document.getElementById('hand').src = PATH + document.getElementById('sel-handle').value + '.png';
            document.getElementById('base').src = PATH + document.getElementById('sel-base').value + '.png';
            document.getElementById('main-head').src = PATH + document.getElementById('sel-main').value + '.png';
            
            const sub = document.getElementById('sel-sub').value;
            document.getElementById('sub-head').style.display = sub === 'none' ? 'none' : 'block';
            if (sub !== 'none') document.getElementById('sub-head').src = PATH + sub + '.png';

            const wing = document.getElementById('sel-wings').value;
            document.getElementById('wings').style.display = wing === 'none' ? 'none' : 'block';
            if (wing !== 'none') document.getElementById('wings').src = PATH + wing + '.png';

            document.getElementById('c1-crystal').style.display = document.getElementById('chk-c1').checked ? 'block' : 'none';
            document.getElementById('c2-crystal').style.display = document.getElementById('chk-c2').checked ? 'block' : 'none';
            
            // Logic คริสตัลรอบหัวคฑา (ย่อให้จัดการง่ายขึ้นตามไฟล์รูปที่คุณมี)
            document.getElementById('c-head-1').style.display = document.getElementById('chk-c3_1') && document.getElementById('chk-c3_1').checked ? 'block' : 'none';
            if(document.getElementById('chk-c3_1')?.checked) document.getElementById('c-head-1').src = PATH + 'C3_1.png'; // เปลี่ยนชื่อไฟล์ตาม MainHead จริง
        }

        // --- 2. Effect เวทมนตร์ & เปลี่ยนหน้า ---
        function triggerMagicEffect() {
            const container = document.getElementById('sparkle-container');
            // สร้างดาววิ้งๆ 30 ดวง
            for(let i=0; i<30; i++) {
                setTimeout(() => {
                    const spark = document.createElement('div');
                    spark.className = 'sparkle';
                    spark.style.left = Math.random() * 100 + 'vw';
                    spark.style.top = Math.random() * 100 + 'vh';
                    const size = Math.random() * 15 + 5;
                    spark.style.width = size + 'px';
                    spark.style.height = size + 'px';
                    container.appendChild(spark);
                    setTimeout(() => spark.remove(), 1000);
                }, i * 30);
            }

            // เฟดหน้าจอเปลี่ยนไปหน้า 2
            setTimeout(() => {
                document.getElementById('screen-builder').classList.add('fade-out');
                setTimeout(() => {
                    document.getElementById('screen-builder').style.display = 'none';
                    document.getElementById('screen-result').style.display = 'block';
                    document.getElementById('screen-result').classList.add('fade-in');
                    
                    // ย้ายตัวคฑามาใส่ในกล่องของหน้า 2
                    const wandDom = document.getElementById('wand-dom');
                    document.getElementById('result-preview-box').appendChild(wandDom);
                }, 500);
            }, 800);
        }

        // --- 3. ระบบสีพื้นหลัง ---
        function changeBgColor() {
            const color = document.getElementById('bg-color').value;
            document.getElementById('wand-dom').style.backgroundColor = color;
        }

        // --- 4. ระบบเปิดปิดพัด (Push Button) ---
        let isFanOpen = false;
        let isAnimating = false;
        const gifDuration = 1200;

        function toggleFan() {
            if (isAnimating) return;
            isAnimating = true;

            const btn = document.getElementById('btn-fan-toggle');
            const headGroup = document.getElementById('head-group');
            const fan = document.getElementById('fan');

            if (!isFanOpen) {
                // เปลี่ยนเป็น ON
                btn.innerHTML = "ON";
                btn.classList.add('active');
                
                fan.src = PATH + 'F0.png';
                headGroup.classList.add('move-down');
                fan.classList.remove('hidden-down');
                fan.classList.add('show-up');

                setTimeout(() => {
                    fan.src = PATH + 'F_animate.gif?' + Date.now();
                    setTimeout(() => {
                        fan.src = PATH + 'F1.png';
                        isFanOpen = true; isAnimating = false;
                    }, gifDuration);
                }, 600);

            } else {
                // เปลี่ยนเป็น OFF
                btn.innerHTML = "OFF";
                btn.classList.remove('active');

                fan.src = PATH + 'F_animate_in.gif?' + Date.now();

                setTimeout(() => {
                    fan.src = PATH + 'F0.png';
                    headGroup.classList.remove('move-down');
                    fan.classList.remove('show-up');
                    fan.classList.add('hidden-down');

                    setTimeout(() => {
                        isFanOpen = false; isAnimating = false;
                    }, 600);
                }, gifDuration);
            }
        }

        // --- 5. ระบบ Export รูปภาพ (HTML5 Canvas 2048x2048px + Watermark) ---
        async function exportToImage() {
            const btn = document.querySelector('.btn-save');
            btn.innerHTML = "Saving...";
            
            // สร้าง Canvas ขนาด 2048x2048
            const canvas = document.createElement('canvas');
            canvas.width = 2048;
            canvas.height = 2048;
            const ctx = canvas.getContext('2d');

            // 1. ถมสีพื้นหลัง
            ctx.fillStyle = document.getElementById('bg-color').value;
            ctx.fillRect(0, 0, 2048, 2048);

            // ฟังก์ชันช่วยโหลดรูปภาพ
            const drawImg = (imgEl, offsetY = 0) => {
                return new Promise((resolve) => {
                    if (!imgEl || imgEl.style.display === 'none' || !imgEl.src || imgEl.src.endsWith('none.png') || imgEl.classList.contains('hidden-down')) {
                        resolve(); return;
                    }
                    const img = new Image();
                    img.crossOrigin = "anonymous";
                    img.onload = () => { ctx.drawImage(img, 0, offsetY, 2048, 2048); resolve(); };
                    img.onerror = resolve; // ข้ามถ้าโหลดรูปไม่ผ่าน
                    img.src = imgEl.src;
                });
            };

            // 2. ลำดับการวาด (อิงตาม Z-Index และสถานะ Y-Offset)
            const headOffsetY = document.getElementById('head-group').classList.contains('move-down') ? 300 : 0;
            
            await drawImg(document.getElementById('fan'), 0);
            await drawImg(document.getElementById('hand'), 0);
            await drawImg(document.getElementById('base'), headOffsetY);
            await drawImg(document.getElementById('wings'), headOffsetY);
            await drawImg(document.getElementById('main-head'), headOffsetY);
            await drawImg(document.getElementById('sub-head'), headOffsetY);
            await drawImg(document.getElementById('c1-crystal'), 0);
            await drawImg(document.getElementById('c2-crystal'), headOffsetY);
            await drawImg(document.getElementById('c-head-1'), headOffsetY);

            // 3. ฝัง Watermark
            ctx.font = "italic 36px 'Mali', sans-serif";
            ctx.fillStyle = "#5e1115"; // สีแดงเข้ม
            ctx.textAlign = "right";
            ctx.fillText("webdesign by emanonmui IG:ium_kamonwan", 2000, 2000); // พิกัดมุมขวาล่าง

            // 4. สั่งดาวน์โหลด
            const link = document.createElement('a');
            link.download = 'MyMagicWand.png';
            link.href = canvas.toDataURL('image/png');
            link.click();

            btn.innerHTML = "SAVE";
        }
    </script>
</body>
</html>
